name: Agent

on:
  push:
    paths: ["agent/**", "blueprints/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", "blueprints/**", ".github/workflows/agent.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest -q

  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Parse blueprints
        run: |
          python - <<'EOF'
          import pathlib, yaml
          yaml.SafeLoader.add_constructor("!input", lambda loader, node: loader.construct_scalar(node))
          for path in pathlib.Path("blueprints").rglob("*.yaml"):
              data = yaml.safe_load(path.read_text())
              assert {"blueprint", "triggers", "actions"} <= data.keys(), path
              print("ok", path)
          EOF

  pyz:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: agent/packaging/build_pyz.sh dist
      - run: python3 dist/host-agent.pyz version
      - uses: actions/upload-artifact@v4
        with:
          name: host-agent-pyz
          path: dist/
