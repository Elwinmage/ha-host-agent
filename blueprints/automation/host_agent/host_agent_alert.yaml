blueprint:
  name: Host Agent - problem alerts
  description: >
    Notifies when a host monitored by **ha-host-agent** reports a problem
    (failing or missing disk, overdue self-test, full or unmounted filesystem...),
    when a new issue appears while a problem is already active, when everything
    is back to normal and when the agent stops reporting.


    By default the **Problem** sensor of every host is watched (one alert per host,
    listing all its issues), including hosts added later: the integration fires a
    `host_agent_problem` event for each change (ha-host-agent 0.4.0 or newer).
    Select problem sensors instead (hosts, disks, filesystems, vaults...) for finer control.


    Variables available in the actions: `title`, `message`, `severity`
    (`warning` / `critical`), `event` (`problem`, `new_issue`, `resolved`,
    `offline`, `online`), `host`, `entity_id`, `issues` (list).
  domain: automation
  author: Elwinmage
  source_url: https://github.com/Elwinmage/ha-host-agent/blob/main/blueprints/automation/host_agent/host_agent_alert.yaml
  homeassistant:
    min_version: 2025.10.0
  input:
    sensors:
      name: Sensors
      icon: mdi:server
      input:
        problem_entities:
          name: Problem sensors (optional)
          description: >
            Leave empty to watch the Problem sensor of every host. Otherwise only
            the selected host, disk, filesystem or vault problem sensors are watched.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class: problem
                  integration: mqtt
        min_severity:
          name: Minimum severity
          default: warning
          selector:
            select:
              options:
                - label: Warnings and critical issues
                  value: warning
                - label: Critical issues only
                  value: critical
        delay:
          name: Confirmation delay
          description: The problem must last this long before the first alert.
          default:
            minutes: 5
          selector:
            duration: {}
    behaviour:
      name: Behaviour
      icon: mdi:tune
      input:
        notify_new_issues:
          name: Alert on new issues
          description: Alert again when another issue appears while a problem is already active.
          default: true
          selector:
            boolean: {}
        notify_resolved:
          name: Alert when resolved
          default: true
          selector:
            boolean: {}
        notify_offline:
          name: Alert when the agent is offline
          description: The sensors become unavailable when the agent stops (LWT).
          default: true
          selector:
            boolean: {}
        offline_delay:
          name: Offline delay
          default:
            minutes: 30
          selector:
            duration: {}
        language:
          name: Message language
          default: fr
          selector:
            select:
              options:
                - label: Français
                  value: fr
                - label: English
                  value: en
    notification:
      name: Notification
      icon: mdi:bell-ring
      input:
        persistent_notification:
          name: Persistent notification
          description: Keep a notification in Home Assistant while the problem lasts (dismissed when resolved).
          default: true
          selector:
            boolean: {}
        alert_actions:
          name: Alert actions
          description: >
            Actions run for each alert, e.g. `notify.mobile_app_xxx` with
            title `{{ title }}` and message `{{ message }}`.
          default: []
          selector:
            action: {}

# Parallel: a run waits for the confirmation delay while other alerts go on
mode: parallel
max: 50
max_exceeded: silent

triggers:
  - trigger: event
    event_type: host_agent_problem

variables:
  selected: !input problem_entities
  lang: !input language
  min_severity: !input min_severity
  notify_new: !input notify_new_issues
  notify_resolved: !input notify_resolved
  notify_offline: !input notify_offline
  persistent: !input persistent_notification
  delay_input: !input delay
  offline_input: !input offline_delay
  data: "{{ trigger.event.data }}"
  event: "{{ data.transition }}"
  entity_id: "{{ data.entity_id }}"
  entity_name: "{{ data.name }}"
  host: "{{ data.host }}"
  elapsed_s: "{{ data.elapsed | int(0) }}"
  delay_s: >-
    {%- set d = delay_input -%}
    {{- (d.days | default(0)) * 86400 + (d.hours | default(0)) * 3600
        + (d.minutes | default(0)) * 60 + (d.seconds | default(0)) -}}
  offline_s: >-
    {%- set d = offline_input -%}
    {{- (d.days | default(0)) * 86400 + (d.hours | default(0)) * 3600
        + (d.minutes | default(0)) * 60 + (d.seconds | default(0)) -}}
  allowed: "{{ ['critical'] if min_severity == 'critical' else ['warning', 'critical'] }}"
  old_issues: "{{ data.previous_issues | selectattr('severity', 'in', allowed) | list }}"
  # Wait before alerting: a problem or an outage must last, other events are immediate
  wait_s: >-
    {{- delay_s if event == 'problem' else (offline_s if event == 'offline' else 0) -}}

conditions:
  - condition: template
    value_template: "{{ entity_id in selected if selected | count > 0 else data.host_sensor }}"
  - condition: template
    value_template: >-
      {%- if event == 'problem' -%}true
      {%- elif event == 'new_issue' -%}
        {#- before the confirmation delay, the problem alert will list every issue -#}
        {{- notify_new and elapsed_s | int >= delay_s | int -}}
      {%- elif event == 'resolved' -%}
        {#- a problem shorter than the delay was never notified -#}
        {{- notify_resolved and old_issues | count > 0 and elapsed_s | int >= delay_s | int -}}
      {%- elif event == 'offline' -%}{{ notify_offline }}
      {%- elif event == 'online' -%}{{ notify_offline and elapsed_s | int >= offline_s | int }}
      {%- else -%}false{%- endif -%}

actions:
  # (a zero delay is not instant on every Home Assistant version: skipped instead)
  - if:
      - condition: template
        value_template: "{{ wait_s | int > 0 }}"
    then:
      - delay: "{{ wait_s | int }}"
  # After the delay, the sensor must still be in the state that started this run
  - condition: template
    value_template: >-
      {%- set st = states[entity_id] -%}
      {{- wait_s | int == 0 or (st is not none and st.state == data.state
          and as_timestamp(st.last_changed) == as_timestamp(data.since)) -}}
  - variables:
      # The issues may have changed during the confirmation delay
      issues: >-
        {%- set all = state_attr(entity_id, 'issues') if event == 'problem' else data.issues -%}
        {{- (all or []) | selectattr('severity', 'in', allowed) | list -}}
      new_issues: >-
        {%- set old_ids = old_issues | map(attribute='id') | list -%}
        {{- issues | rejectattr('id', 'in', old_ids) | list -}}
      severity: >-
        {%- set src = old_issues if event == 'resolved' else issues -%}
        {{- 'critical' if src | selectattr('severity', 'eq', 'critical') | list | count > 0 else 'warning' -}}
      texts:
        fr:
          problem: Anomalie
          new_issue: Nouvelle anomalie
          resolved: Retour à la normale
          offline: Agent hors ligne
          online: Agent de nouveau en ligne
          resolved_msg: Plus aucune anomalie.
          offline_msg: "Aucune donnée reçue depuis {} min."
          online_msg: "L'agent publie à nouveau après {} min d'absence."
        en:
          problem: Problem
          new_issue: New issue
          resolved: Back to normal
          offline: Agent offline
          online: Agent back online
          resolved_msg: No more issues.
          offline_msg: "No data received for {} min."
          online_msg: "The agent is reporting again after {} min."
  - condition: template
    value_template: >-
      {%- if event == 'problem' -%}{{ issues | count > 0 }}
      {%- elif event == 'new_issue' -%}{{ new_issues | count > 0 }}
      {%- else -%}true{%- endif -%}
  - variables:
      title: >-
        {%- set alert = '🔴' if severity == 'critical' else '🟠' -%}
        {%- set icon = {'problem': alert, 'new_issue': alert, 'resolved': '🟢',
                        'offline': '⚫', 'online': '🟢'}[event] -%}
        {{- icon }} {{ host }} : {{ texts[lang][event] -}}
      message: >-
        {%- if event in ['problem', 'new_issue'] -%}
          {%- for i in (new_issues if event == 'new_issue' else issues) -%}
            • {{ i.get('subject_name') or entity_name }} : {{ i.message }}{{ '\n' if not loop.last }}
          {%- endfor -%}
        {%- elif event == 'resolved' -%}{{ texts[lang].resolved_msg }}
        {%- elif event == 'offline' -%}{{ texts[lang].offline_msg.replace('{}', (offline_s | int // 60) | string) }}
        {%- else -%}{{ texts[lang].online_msg.replace('{}', (elapsed_s | int // 60) | string) }}
        {%- endif -%}
      persistent_message: >-
        {%- if issues | count > 0 -%}
          {%- for i in issues -%}
            • {{ i.get('subject_name') or entity_name }} : {{ i.message }}{{ '\n' if not loop.last }}
          {%- endfor -%}
        {%- else -%}{{ message }}{%- endif -%}
      notification_id: "host_agent_{{ entity_id | replace('.', '_') }}"
  - if:
      - condition: template
        value_template: "{{ persistent | bool }}"
    then:
      - if:
          - condition: template
            value_template: "{{ event == 'resolved' or (event == 'online' and issues | count == 0) }}"
        then:
          - action: persistent_notification.dismiss
            data:
              notification_id: "{{ notification_id }}"
        else:
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "{{ title }}"
              message: "{{ persistent_message }}"
  - sequence: !input alert_actions
